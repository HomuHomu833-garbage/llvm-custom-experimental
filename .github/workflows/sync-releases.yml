name: Sync releases
run-name: Sync ${{ inputs.tag }} to ${{ inputs.destination }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. llvm-r22"
        required: true
        type: string
      destination:
        description: "repository to copy to"
        required: true
        type: string
        default: HomuHomu833/llvm-custom

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.TOKEN }}
      SRC: ${{ github.repository }}
      DST: ${{ inputs.destination }}
      TAG: ${{ inputs.tag }}
    steps:
      # Assets only: the destination release has to exist already, so its tag
      # and date stay whatever upstream gave them.
      - name: Copy assets
        run: |
          mkdir -p /tmp/sync && cd /tmp/sync
          id=$(gh api "repos/$DST/releases/tags/$TAG" -q .id) || {
            echo "$DST has no $TAG release" >&2; exit 1; }
          gh api --paginate "repos/$DST/releases/$id/assets?per_page=100" \
            -q '.[]|"\(.name) \(.size) \(.id)"' > have
          src_id=$(gh api "repos/$SRC/releases/tags/$TAG" -q .id)
          gh api --paginate "repos/$SRC/releases/$src_id/assets?per_page=100" \
            -q '.[]|"\(.name) \(.size)"' > want
          n=0
          while read -r name size; do
            n=$((n + 1))
            old=$(awk -v n="$name" '$1 == n' have)
            if [ -n "$old" ]; then
              [ "$(cut -d' ' -f2 <<<"$old")" = "$size" ] && continue
              gh api -X DELETE "repos/$DST/releases/assets/$(cut -d' ' -f3 <<<"$old")"
            fi
            echo "[$n] $name"
            curl -fsSL --retry 5 -o "$name" "https://github.com/$SRC/releases/download/$TAG/$name"
            curl -fsS --retry 5 -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$name" \
              "https://uploads.github.com/repos/$DST/releases/$id/assets?name=$name"
            rm -f "$name"
          done < want

      - name: Verify
        run: |
          names() {
            id=$(gh api "repos/$1/releases/tags/$TAG" -q .id)
            gh api --paginate "repos/$1/releases/$id/assets?per_page=100" -q '.[].name' | sort
          }
          missing=$(comm -23 <(names "$SRC") <(names "$DST"))
          [ -z "$missing" ] || { echo "missing in $DST:"; echo "$missing"; exit 1; }
          echo "all $(names "$SRC" | wc -l) assets of $SRC $TAG are in $DST"
